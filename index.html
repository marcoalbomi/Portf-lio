    :root {
      --bg: #ffffff;
      --surface: #f5f5f5;
      --surface-warm: #fafafa;
      --fg: #111111;
      --fg-2: var(--fg);
      --muted: #707072;
      --meta: #9e9ea0;
      --border: #cacacb;
      --border-soft: #e5e5e5;
      --accent: #111111;
      --accent-on: #ffffff;
      --accent-hover: #707072;
      --accent-active: #000000;
      --success: #007d48;
      --warn: #fca600;
      --danger: #d30005;
      --font-display: "Drowner", "Nike Futura ND", "Helvetica Now Display Medium", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-body: "Helvetica Now Text Medium", "Helvetica Now Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
      --text-xs: 12px;
      --text-sm: 14px;
      --text-base: 16px;
      --text-lg: 20px;
      --text-xl: 24px;
      --text-2xl: 32px;
      --text-3xl: 48px;
      --text-4xl: 96px;
      --leading-body: 1.75;
      --leading-tight: 0.9;
      --tracking-display: -0.02em;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-12: 48px;
      --radius-sm: 8px;
      --radius-md: 20px;
      --radius-lg: 24px;
      --radius-pill: 30px;
      --elev-flat: none;
      --elev-ring: 0 0 0 1px var(--border);
      --elev-raised: 0 0 0 1px var(--border);
      --focus-ring: 0 0 0 2px rgba(39, 93, 197, 1);
      --motion-fast: 150ms;
      --motion-base: 200ms;
      --ease-standard: cubic-bezier(0.2, 0, 0, 1);
      --container-max: 1440px;
      --container-gutter-desktop: 48px;
      --container-gutter-tablet: 24px;
      --container-gutter-phone: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; overflow: hidden; height: 100%; scrollbar-width: none; }
    html::-webkit-scrollbar { display: none; }
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.55;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      scrollbar-width: none;
    }
    body::-webkit-scrollbar { display: none; }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid rgba(39, 93, 197, 1); outline-offset: 2px; }
    p { text-wrap: pretty; }

      user-select: none;
    }

    .carousel-stage {
      display: flex;

      height: 100%;
      will-change: transform;
    }
    .carousel-card {

    .carousel-card:hover .carousel-card-inner {

    .card-label {

      font-weight: 500;
      color: var(--fg);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 60px;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
      line-height: 1.2;
      word-break: break-word;
      hyphens: auto;
    }
    .carousel-card:hover .card-label {
      opacity: 1;
      transform: translateY(0);
    }
    .card-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: var(--surface);
    }
    .card-cover-empty {
      width: 100%;

    @media (min-width: 640px) {

        object-fit: none;
      }
    }
    }
    .overlay-stack .stack-embed {

    }
    .overlay-stack .stack-link {
      padding: 24px;

    }
    .overlay-stack .stack-link a {

    .admin-project-card {

    }

    .admin-body .btn {

    }

    .cover-upload-behance{

    }

    const SB_HEADERS = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };
    function sbFetch(path, opts) { return fetch(SB_URL + path, Object.assign({ headers: SB_HEADERS }, opts)); }
    function sbGet(path) { return sbFetch(path, { method: 'GET' }).then(function(r) { if (!r.ok) throw new Error('GET ' + path + ' ' + r.status); return r.json(); }); }

    /* ── Storage helpers — upload images to Supabase Storage ──

     * ──────────────────────────────────────────────────────────── */
    function dataUrlToBlob(dataUrl) {
      var parts = dataUrl.split(',');
      var mimeMatch = parts[0].match(/:(.*?);/);
      if (!mimeMatch) return null;
      var bytes = atob(parts[1]);
      var arr = new Uint8Array(bytes.length);

      return new Blob([arr], { type: mimeMatch[1] });

          c.width = w; c.height = h;
          var ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

        img.onerror = function() { resolve(dataUrl); };

      });

    /* Retry wrapper for fetch — up to 3 attempts with 1s backoff */
    function retryFetch(url, opts, retries) {
      retries = retries || 3;
      return fetch(url, opts).then(function(r) {
        if (!r.ok && retries > 0) {
          return new Promise(function(resolve) {
            setTimeout(function() {
              resolve(retryFetch(url, opts, retries - 1));
            }, 1000);
          });
        }
        if (!r.ok) { return r.text().then(function(t) { throw new Error('HTTP ' + r.status + ': ' + (t||'')); }); }
        return r;
      });
    }

    /* Upload a single image to Supabase Storage "portfolio" bucket.
     * Steps: 1) compress, 2) convert to blob, 3) upload with retry,
     * 4) return public URL. On failure, returns '' (caller keeps local dataUrl). */
    /* Upload a single image to Supabase Storage "portfolio" bucket.
     * Compression cascade: maxWidth/quality can be overridden for retry.
     * On failure, returns '' (caller keeps local dataUrl). */
    async function uploadImage(dataUrl, prefix, maxWidth, quality) {
      try {
        if (!dataUrl || !dataUrl.startsWith('data:')) return dataUrl;
        var compressed = await compressImage(dataUrl, maxWidth || 1920, quality || 0.85);
        var blob = dataUrlToBlob(compressed);
        if (!blob) throw new Error('Invalid blob from dataUrl');
        var ext = blob.type.split('/')[1] || 'jpg';
        var safeExt = ext.replace(/[^a-z0-9]/gi, 'jpg');
        var path = (prefix||'img') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8) + '.' + safeExt;
        console.log('[Supabase] Uploading', path, '- size:', Math.round(blob.size/1024)+'KB');
        var resp = await retryFetch(SB_URL + '/storage/v1/object/portfolio/' + path, {
          method: 'POST',
          headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': blob.type, 'x-upsert': 'true' },
          body: blob
        });
        if (!resp.ok) throw new Error('Upload failed with status ' + resp.status + ' ' + (await resp.text().catch(function(){return''})));
        console.log('[Supabase] Upload OK — path:', path);
        return SB_URL + '/storage/v1/object/public/portfolio/' + path;
      } catch(e) {
        console.warn('[Supabase] uploadImage failed:', e.message);
        return '';
      }
    }

    async function uploadSiteImage(dataUrl, prefix, maxWidth, quality) {

    /* Upload any blob (video, image, etc.) to Supabase Storage "portfolio" bucket.
     * Accepts either a dataUrl string or a Blob (preferred for videos).
     * Returns public URL on success, '' on failure (caller keeps local dataUrl). */
    async function uploadBlobToStorage(dataUrl_or_Blob, prefix) {
      try {
        var blob;
        if (dataUrl_or_Blob instanceof Blob) {
          blob = dataUrl_or_Blob;
        } else {
          if (!dataUrl_or_Blob || typeof dataUrl_or_Blob !== 'string' || !dataUrl_or_Blob.startsWith('data:')) return dataUrl_or_Blob;
          blob = dataUrlToBlob(dataUrl_or_Blob);
        }
        if (!blob) throw new Error('Invalid blob');
        var ext = blob.type.split('/')[1] || 'bin';
        var safeExt = ext.replace(/[^a-z0-9]/gi, 'bin');
        var path = (prefix||'blob') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8) + '.' + safeExt;
        console.log('[Supabase] Uploading blob', path, '- size:', Math.round(blob.size/1024)+'KB', '- type:', blob.type);
        var resp = await retryFetch(SB_URL + '/storage/v1/object/portfolio/' + path, {
          method: 'POST',
          headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': blob.type, 'x-upsert': 'true' },
          body: blob
        });
        if (!resp.ok) throw new Error('Upload failed ' + resp.status);
        var publicUrl = SB_URL + '/storage/v1/object/public/portfolio/' + path;
        console.log('[Supabase] Upload OK —', publicUrl);
        return publicUrl;
      } catch(e) {
        console.warn('[Supabase] uploadBlobToStorage failed:', e.message);
        return '';
      }
    }

    /* Resolve any cover format to a public Supabase URL.
     * Three-pass compression cascade: tries 1920px/0.85, then 1200px/0.7, then 800px/0.5.
     * Returns '' only when all three fail — caller keeps local dataUrl. */
    async function resolveCover(cover, prefix) {
      if (!cover) return '';
      if (cover.startsWith('http') && cover.indexOf('supabase.co') > 0) return cover;
      if (cover.startsWith(SB_URL)) return cover;
      if (cover.startsWith('data:')) {
        /* Three-pass compression cascade */
        var result = await uploadImage(cover, prefix, 1920, 0.85);
        if (result) return result;
        console.log('[Supabase] Retry 1 — 1200px, quality 0.7');
        result = await uploadImage(cover, prefix, 1200, 0.7);
        if (result) return result;
        console.log('[Supabase] Retry 2 — 800px, quality 0.5');
        result = await uploadImage(cover, prefix, 800, 0.5);
        if (!result) console.warn('[Supabase] All 3 upload attempts failed for', prefix);
        return result;
      }
      return '';
    }

    function setupSSUploads() {
      ['ssLogo', 'ssFavicon', 'ssBanner'].forEach(function(id) {

    async function saveSiteSettings() {
      var btn = document.getElementById('ssSaveBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Salvando...' }
      var statusEl = document.getElementById('ssSaveStatus');
      if (statusEl) statusEl.textContent = '';
      var data = {
        site_name: document.getElementById('ssSiteName').value || 'Marco Albornoz',
        logo_url: document.getElementById('ssLogoUrl').value || '',
        favicon_url: document.getElementById('ssFaviconUrl').value || '',

        email: document.getElementById('ssEmail').value || '',
        instagram: document.getElementById('ssInstagram').value || '',
        facebook: document.getElementById('ssFacebook').value || '',
        address: document.getElementById('ssAddress').value || '',
        seo_title: document.getElementById('ssSeoTitle').value || '',
        seo_description: document.getElementById('ssSeoDescription').value || ''
      };
      try {
        if (ssData && ssData.id) {
          await sbFetch('/rest/v1/site_settings?id=eq.' + ssData.id, { method: 'PATCH', headers: SB_HEADERS, body: JSON.stringify(data) });
        } else {
          var r = await sbFetch('/rest/v1/site_settings', { method: 'POST', headers: SB_HEADERS, body: JSON.stringify(data) });
          if (r.ok) try { var j = await r.json(); if (Array.isArray(j) && j.length > 0) ssData = j[0]; else ssData = j } catch (e) { }
        }
        if (statusEl) { statusEl.textContent = 'Salvo com sucesso!'; statusEl.style.color = 'var(--success)' }

      } catch (e) {
        if (statusEl) { statusEl.textContent = 'Erro: ' + e.message; statusEl.style.color = 'var(--danger)' }

      }
      if (btn) { btn.disabled = false; btn.textContent = 'Salvar' }
    }

    function handleImport(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (Array.isArray(data)) {
            showImportConfirm({ type: 'projects', projects: data });
          } else if (data && data._exportVersion) {
            showImportConfirm({ type: 'full', projects: data.projects || [], config: data.config, messages: data.messages });
          } else if (data && data.projects) {
            showImportConfirm({ type: 'full', projects: data.projects, config: data.config, messages: data.messages });
          } else {
            throw new Error('Formato não reconhecido');
          }
        } catch {
          showToast('Arquivo inválido. Selecione um JSON de exportação.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    let pendingImportData = null;

    function showImportConfirm(data) {
      pendingImportData = data;
      const count = data.projects ? data.projects.length : 0;
      const extra = [];
      if (data.config) extra.push('configurações');
      if (data.messages) extra.push('mensagens');
      const extraStr = extra.length ? ' + ' + extra.join(', ') : '';
      document.getElementById('confirmTitle').textContent = 'Importar Dados';
      document.getElementById('confirmMessage').textContent = `Importar ${count} projeto(s)${extraStr}? Os dados atuais serão SUBSTITUÍDOS.`;
      document.getElementById('confirmId').value = 'import';
      document.getElementById('confirmYes').textContent = 'Importar';
      document.getElementById('confirmYes').style.background = 'var(--fg)';
      document.getElementById('confirmModal').classList.add('open');
    }

    async function doImportProjects() {
      if (!pendingImportData) return;
      if (pendingImportData.type === 'full') {
        if (pendingImportData.projects) {
          projects = pendingImportData.projects.map((p, i) => ({ ...p, id: i }));
          saveProjects();
        }
        if (pendingImportData.config) {
          siteConfig = pendingImportData.config;
          saveConfig();
        }
        if (pendingImportData.messages) {
          try { localStorage.setItem('od_portfolio_messages', JSON.stringify(pendingImportData.messages)); } catch {}
        }
      } else {
        projects = pendingImportData.projects.map((p, i) => ({ ...p, id: i }));
        saveProjects();
      }
      pendingImportData = null;
      rebuildAll();
      renderAdmin();
      showToast('Dados importados com sucesso!');
    }

    function importByLink() {
      const url = document.getElementById('importLinkUrl').value.trim();
      if (!url) { showToast('Insira uma URL válida'); return; }
      const status = document.getElementById('importLinkStatus');
      status.textContent = 'Baixando...';
      fetch(url)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then(data => {
          if (!Array.isArray(data)) throw new Error('Formato inválido — esperado array');
          status.textContent = `${data.length} projeto(s) encontrado(s).`;
          showImportConfirm(data);
          closeImportLink();
        })
        .catch(err => {
          status.textContent = `Erro: ${err.message}`;
          showToast('Erro ao importar: ' + err.message);
        });
    }

    let editingBlocks = [], editingCover = '', settingsTemp = {}, attachedFiles = [], editingBlocksGap = 60;

    function openEditor(id) {
      editingId = id;
      const canvas = document.getElementById('editorCanvas');
      if (id !== null) {
        const p = projects.find(pr => pr.id === id);
        if (!p) return;
        editingBlocks = (p.blocks && p.blocks.length > 0 ? p.blocks : p.media && p.media.length > 0 ? p.media.map(m => ({ id: 'bl_' + genId(), type: 'image', data: { mediaId: m.mediaId, dataUrl: m.dataUrl, caption: '' } })) : []).map(b => JSON.parse(JSON.stringify(b)));
        editingCover = p.cover || '';
        editingBlocksGap = p.blockSpacing ?? 60;
        document.getElementById('editorBarTitle').textContent = 'Editar Projeto';
      } else {
        editingBlocks = []; editingCover = ''; editingBlocksGap = 60;
        document.getElementById('editorBarTitle').textContent = 'Novo Projeto';
      }
      renderEditorCanvas();
      renderEditorSidebar();
      renderFontList();
      document.getElementById('editorOverlay').classList.add('open');
      document.getElementById('editorContainer').classList.add('open');
      document.body.style.overflow = 'hidden'
    }
    function closeEditor() {
      document.getElementById('editorOverlay').classList.remove('open');
      document.getElementById('editorContainer').classList.remove('open');
      document.body.style.overflow = '';
      attachedFiles = [];
    }
    function editProject(id) { openEditor(id) }
    function showAddForm() { openEditor(null) }

    function renderEditorCanvas() {
      const c = document.getElementById('editorCanvas');
      const p = editingId !== null ? projects.find(pr => pr.id === editingId) : null;
      const prevTitle = document.getElementById('edTitle') ? document.getElementById('edTitle').value : '';
      const prevTag = document.getElementById('edTag') ? document.getElementById('edTag').value : '';
      const prevAno = document.getElementById('edAno') ? document.getElementById('edAno').value : '';
      let html = '<div class="editor-canvas-inner">';
      html += `<input class="editor-title-input" id="edTitle" value="${esc(prevTitle || (p ? p.title : ''))}" placeholder="Título do Projeto" />`;
      html += `<div class="editor-meta-row">`;
      html += `<input class="editor-meta-input" id="edTag" value="${esc(prevTag || (p ? p.tag : ''))}" placeholder="Categoria · Tag" style="flex:1.5" />`;
      html += `<input class="editor-meta-input" id="edAno" value="${esc(prevAno || (p ? p.ano : ''))}" placeholder="Ano" style="min-width:80px;flex:.5" />`;
      html += `</div>`;
      html += `<div class="editor-blocks" id="edBlocks">`;
      editingBlocks.forEach((b, i) => { html += renderBlock(b, i) });
      html += `</div>`;
      html += `<button class="add-block-btn" onclick="showBlockPicker()">+ Adicionar bloco de conteúdo</button>`;
      html += '</div>';
      c.innerHTML = html
    }

    function renderBlock(b, i) {
      let body = '';
      switch (b.type) {
        case 'image': body = renderImgBlock(b, i); break;
        case 'text': body = renderTextBlock(b, i); break;
        case 'gallery': body = renderGalBlock(b, i); break;
        case 'video': body = renderVidBlock(b, i); break;
        case 'embed': body = renderEmbBlock(b, i); break;
        case 'prototype': body = renderProtoBlock(b, i); break;
        case '3d': body = render3dBlock(b, i); break;
        default: body = '<div class="block-empty-placeholder">Bloco desconhecido</div>'
      }
      return `<div class="block-card"><div class="block-card-header"><div class="block-type-label">${blkIcon(b.type)}${blkLabel(b.type)}</div><div class="block-card-actions"><button onclick="moveBlock(${i},-1)" title="Cima">▲</button><button onclick="moveBlock(${i},1)" title="Baixo">▼</button><button onclick="delBlock(${i})" title="Remover">✕</button></div></div><div class="block-card-body">${body}</div></div>`
    }
    function blkIcon(t) { const m = { 'image': '📷', 'text': 'T', 'gallery': '🖼', 'video': '▶', 'embed': '</>', 'prototype': '◎', '3d': '3D' }; return `<span class="sb-icon" style="width:26px;height:26px;font-size:12px;display:grid;place-items:center;border-radius:50%;background:#f0f0f0;flex-shrink:0">${m[t] || '?'}</span>` }
    function blkLabel(t) { const m = { 'image': 'Imagem', 'text': 'Texto', 'gallery': 'Galeria', 'video': 'Vídeo', 'embed': 'Incorporar', 'prototype': 'Protótipo', '3d': '3D' }; return m[t] || t }

    function renderImgBlock(b, i) {
      const url = resolveMediaUrl(b.data) || b.data.dataUrl || '';
      if (url) return `<div class="block-preview-img-wrap"><img src="${esc(url)}" class="block-preview-img" alt="" /><button class="img-del-btn" onclick="delBlockImg(${i})">✕</button></div>`;
      return `<div class="block-upload-zone" onclick="document.getElementById('blkFile${i}').click()"><div class="uz-icon">⬡</div><div>Clique para escolher uma imagem</div><input type="file" id="blkFile${i}" accept="image/*" onchange="uploadBlockImg(${i},event)" /></div>`
    }
    function renderTextBlock(b, i) {
      const currentFont = b.data.fontFamily || '';
      const uploadedFonts = getUploadedFonts();
      let sel = '<div class="block-text-wrap"><div class="block-text-toolbar"><select class="block-text-font-select" id="blkFontSel' + i + '" onchange="updateTextFont(' + i + ',this.value)">';
      sel += '<option value=""' + (!currentFont ? ' selected' : '') + '>Padrão (Helvetica Now)</option>';
      sel += '<option value="Arial"' + (currentFont === 'Arial' ? ' selected' : '') + '>Arial</option>';
      sel += '<option value="Georgia"' + (currentFont === 'Georgia' ? ' selected' : '') + '>Georgia</option>';
      sel += '<option value="Times New Roman"' + (currentFont === 'Times New Roman' ? ' selected' : '') + '>Times New Roman</option>';
      sel += '<option value="Courier New"' + (currentFont === 'Courier New' ? ' selected' : '') + '>Courier New</option>';
      sel += '<option value="Verdana"' + (currentFont === 'Verdana' ? ' selected' : '') + '>Verdana</option>';
      sel += '<option value="Segoe UI"' + (currentFont === 'Segoe UI' ? ' selected' : '') + '>Segoe UI</option>';
      sel += '<option value="Calibri"' + (currentFont === 'Calibri' ? ' selected' : '') + '>Calibri</option>';
      sel += '<option value="Impact"' + (currentFont === 'Impact' ? ' selected' : '') + '>Impact</option>';
      if (uploadedFonts.length) {
        sel += '<option disabled>─── Baixadas ───</option>';
        uploadedFonts.forEach(function(f) { sel += '<option value="' + esc(f.family) + '"' + (f.family === currentFont ? ' selected' : '') + '>' + esc(f.name) + '</option>' })
      }
      sel += '</select><button class="block-font-add" onclick="uploadCustomFont(' + i + ')">+ Adicionar fonte</button></div>';
      sel += '<textarea class="block-text-area" id="blkText' + i + '" placeholder="Escreva seu texto aqui..." oninput="updateTextBlock(' + i + ',this.value)" style="font-family:' + esc(currentFont || 'var(--font-body)') + '">' + esc(b.data.content || '') + '</textarea></div>';
      return sel;
    }
    function renderGalBlock(b, i) {
      const imgs = b.data.images || [];
      let h = '<div class="block-gallery-grid">';
      imgs.forEach((img, idx) => {
        const u = resolveMediaUrl(img) || img.dataUrl || '';
        h += `<div class="block-gallery-item"><img src="${esc(u)}" alt="" /><button class="gal-del" onclick="delGalImg(${i},${idx})">✕</button></div>`
      });
      h += `<div class="block-gallery-item" style="border:2px dashed #ddd;display:grid;place-items:center;cursor:pointer;color:#aaa;font-size:24px" onclick="document.getElementById('galFile${i}').click()">+<input type="file" id="galFile${i}" accept="image/*" multiple style="display:none" onchange="addGalImg(${i},event)" /></div>`;
      h += '</div>';
      return h
    }
    function renderVidBlock(b, i) {
      const url = resolveMediaUrl(b.data) || b.data.dataUrl || '';
      if (url) return `<div class="block-preview-img-wrap"><video src="${esc(url)}" class="block-video-el" controls></video><button class="img-del-btn" onclick="delBlockImg(${i})">✕</button></div>`;
      return `<div class="block-upload-zone" onclick="document.getElementById('blkFile${i}').click()"><div class="uz-icon">▶</div><div>Clique para escolher um vídeo</div><input type="file" id="blkFile${i}" accept="video/*" onchange="uploadBlockVid(${i},event)" /></div>`
    }
    function renderEmbBlock(b, i) {
      const d = b.data || {};
      return `<input class="block-embed-in" value="${esc(d.url || '')}" placeholder="URL do YouTube, Vimeo..." oninput="updateEmbBlock(${i},'url',this.value)" /><input class="block-embed-in" value="${esc(d.html || '')}" placeholder="Ou cole o código HTML de embed" oninput="updateEmbBlock(${i},'html',this.value)" />${d.url || d.html ? `<div class="block-embed-prev">${d.html ? d.html : `<iframe src="${esc(d.url)}" style="width:100%;height:280px;border:none" allowfullscreen></iframe>`}</div>` : ''}`
    }
    function renderProtoBlock(b, i) { return renderSimpleBlock(b, i, 'URL do protótipo (Figma, XD...)') }
    function render3dBlock(b, i) { return renderSimpleBlock(b, i, 'URL do modelo 3D (Sketchfab...)') }
    function renderSimpleBlock(b, i, ph) {
      return `<input class="block-simple-in" value="${esc(b.data && b.data.url ? b.data.url : '')}" placeholder="${ph}" oninput="updateSimpleBlock(${i},this.value)" />`
    }

    /* ── Block actions ── */
    function addBlock(type) {
      let data = {};
      switch (type) {
        case 'image': data = { url: '', caption: '' }; break;
        case 'text': data = { content: '', fontFamily: '' }; break;
        case 'gallery': data = { images: [] }; break;
        case 'video': data = { url: '', caption: '' }; break;
        case 'embed': data = { html: '', url: '' }; break;
        case 'prototype': data = { url: '' }; break;
        case '3d': data = { url: '' }; break
      }
      editingBlocks.push({ id: 'bl_' + genId(), type, data });
      renderEditorCanvas();
      renderEditorSidebar();
      renderFontList();
      const picker = document.getElementById('blockPicker');
      if (picker) picker.remove()
    }
    function moveBlock(i, dir) {
      const t = i + dir;
      if (t < 0 || t >= editingBlocks.length) return;
      [editingBlocks[i], editingBlocks[t]] = [editingBlocks[t], editingBlocks[i]];
      renderEditorCanvas()
    }
    function delBlock(i) { editingBlocks.splice(i, 1); renderEditorCanvas() }
    function delBlockImg(i) { editingBlocks[i].data = { url: '', caption: '' }; renderEditorCanvas() }
    async function uploadBlockImg(i, ev) {
      const f = ev.target.files[0]; if (!f) return;
      const url = await uploadFile(f, 'blk');
      editingBlocks[i].data = { url: url || '', caption: '' };
      renderEditorCanvas()
    }
    async function uploadBlockVid(i, ev) {
      const f = ev.target.files[0]; if (!f) return;
      const url = await uploadFile(f, 'vid');
      editingBlocks[i].data = { url: url || '', caption: '' };
      renderEditorCanvas()
    }
    function updateTextBlock(i, val) { editingBlocks[i].data.content = val }
    function updateTextFont(i, val) {
      editingBlocks[i].data.fontFamily = val;
      const ta = document.getElementById('blkText' + i);
      if (ta) ta.style.fontFamily = val || 'var(--font-body)';
    }
    function updateEmbBlock(i, k, val) { editingBlocks[i].data[k] = val; renderEditorCanvas() }
    function updateSimpleBlock(i, val) { editingBlocks[i].data = { url: val } }
    async function addGalImg(i, ev) {
      const files = Array.from(ev.target.files);
      for (const f of files) {
        if (!f) continue;
        const url = await uploadFile(f, 'gal');
        editingBlocks[i].data.images.push({ url: url || '' });
      }
      renderEditorCanvas()
    }
    function delGalImg(bi, ii) { editingBlocks[bi].data.images.splice(ii, 1); renderEditorCanvas() }

    function showBlockPicker() {
      const existing = document.getElementById('blockPicker');
      if (existing) return existing.remove();
      const types = ['image', 'text', 'gallery', 'video', 'embed', 'prototype', '3d'];
      const labels = { 'image': 'Imagem', 'text': 'Texto', 'gallery': 'Galeria', 'video': 'Vídeo', 'embed': 'Incorporar', 'prototype': 'Protótipo', '3d': '3D' };
      const icons = { 'image': '📷', 'text': 'T', 'gallery': '🖼', 'video': '▶', 'embed': '</>', 'prototype': '◎', '3d': '3D' };
      let h = '<div class="block-card" id="blockPicker" style="background:#f8f8f8;border:2px solid #ddd"><div class="block-card-body"><div style="font-size:13px;font-weight:600;margin-bottom:10px;color:var(--muted)">Escolha o tipo de bloco</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px">';
      types.forEach(t => { h += `<button class="sb-btn" onclick="addBlock('${t}')" style="padding:12px 4px"><span class="sb-icon" style="font-size:18px;width:36px;height:36px">${icons[t]}</span><span class="sb-label" style="font-size:10px">${labels[t]}</span></button>` });
      h += '</div><button onclick="document.getElementById(\'blockPicker\').remove()" style="margin-top:10px;padding:6px 14px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#999;font-size:12px;cursor:pointer">Cancelar</button></div></div>';
      const btn = document.querySelector('.add-block-btn');
      if (btn) btn.insertAdjacentHTML('beforebegin', h)
    }

    function updateBlockGap(val) {
      editingBlocksGap = parseInt(val) || 0;
      document.getElementById('blockGapValue').textContent = editingBlocksGap + 'px';
      document.getElementById('edBlocks').style.setProperty('--block-gap', editingBlocksGap + 'px');
      if (typeof settingsTemp !== 'undefined' && settingsTemp) settingsTemp.blockSpacing = editingBlocksGap
    }

    /* ── Sidebar cover upload ── */
    function handleSidebarCover(ev) {
      const f = ev.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = async e => {
        editingCover = e.target.result;
        const inner = document.getElementById('sbCoverInner');
        if (inner) inner.innerHTML = `<img src="${esc(editingCover)}" alt="Capa" /><button class="cover-remove" onclick="removeSidebarCover(event)">✕</button>`;
        showToast('Capa definida')
      };
      r.readAsDataURL(f);
      ev.target.value = ''
    }
    function removeSidebarCover(ev) {
      if (ev) ev.stopPropagation();
      editingCover = '';
      const inner = document.getElementById('sbCoverInner');
      if (inner) inner.innerHTML = '<div class="cover-placeholder"><div class="cp-icon">📷</div>Adicionar capa</div>';
      showToast('Capa removida')
    }

    /* ── Font management ── */
    function getUploadedFonts() {
      try { return JSON.parse(localStorage.getItem('od_portfolio_fonts') || '[]') } catch { return [] }
    }
    function saveUploadedFonts(fonts) { localStorage.setItem('od_portfolio_fonts', JSON.stringify(fonts)) }
    function handleFontUpload(ev) {
      const f = ev.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = function(e) {
        const dataUrl = e.target.result;
        const name = f.name.replace(/\.[^.]+$/, '');
        const family = name.replace(/[^a-zA-Z0-9]/g, '-');
        try {
          const ff = new FontFace(family, 'url(' + dataUrl + ')');
          ff.load().then(function() { document.fonts.add(ff); showToast('Fonte "' + name + '" carregada') }).catch(function() {})
        } catch (ex) { console.warn(ex) }
        const fonts = getUploadedFonts();
        if (!fonts.some(function(g) { return g.family === family })) {
          fonts.push({ name, family, data: dataUrl });
          saveUploadedFonts(fonts);
        }
        renderFontList();
      };
      r.readAsDataURL(f);
      ev.target.value = ''
    }
    function uploadCustomFont(i) {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = '.ttf,.woff,.woff2,.otf';
      inp.style.display = 'none';
      inp.onchange = function(ev) {
        const f = ev.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = function(e) {
          const dataUrl = e.target.result;
          const name = f.name.replace(/\.[^.]+$/, '');
          const family = name.replace(/[^a-zA-Z0-9]/g, '-');
          try {
            const ff = new FontFace(family, 'url(' + dataUrl + ')');
            ff.load().then(function() { document.fonts.add(ff) }).catch(function() {})
          } catch (ex) { console.warn(ex) }
          const fonts = getUploadedFonts();
          if (!fonts.some(function(g) { return g.family === family })) {
            fonts.push({ name, family, data: dataUrl });
            saveUploadedFonts(fonts);
          }
          editingBlocks[i].data.fontFamily = family;
          renderEditorCanvas();
          renderFontList();
          showToast('Fonte "' + name + '" aplicada');
        };
        r.readAsDataURL(f);
      };
      document.body.appendChild(inp);
      inp.click();
      setTimeout(function() { inp.remove() }, 100)
    }
    function renderFontList() {
      const container = document.getElementById('fontListSidebar');
      if (!container) return;
      const fonts = getUploadedFonts();
      if (!fonts.length) { container.innerHTML = '<div style="font-size:11px;color:#bbb">Nenhuma fonte adicionada</div>'; return }
      container.innerHTML = fonts.map(function(f) {
        return '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:#f8f8f8;border-radius:6px;margin-bottom:4px"><span style="font-family:' + f.family + ';font-size:14px">' + f.name + '</span><span style="font-size:10px;color:#ccc;font-family:var(--font-body)">' + f.family + '</span></div>'
      }).join('')
    }
    /* ── Attach assets (sidebar) ── */
    function handleAttach(ev) {
      const files = Array.from(ev.target.files);
      files.forEach(async f => {
        attachedFiles.push({ name: f.name, type: f.type });
        renderAttached();
        if (f.type && f.type.startsWith('image/')) {
          const url = await uploadFile(f, 'img');
          editingBlocks.push({ id: 'bl_' + genId(), type: 'image', data: { url: url || '', caption: '' } });
          renderEditorCanvas()
        } else if (f.type && f.type.startsWith('video/')) {
          const url = await uploadFile(f, 'vid');
          editingBlocks.push({ id: 'bl_' + genId(), type: 'video', data: { url: url || '', caption: '' } });
          renderEditorCanvas()
        }
      });
      ev.target.value = ''
    }
    function renderAttached() {
      const c = document.getElementById('attachedGrid');
      if (!c) return;
      if (attachedFiles.length === 0) { c.innerHTML = ''; return }
      c.innerHTML = attachedFiles.map((a, i) => '<div class="att-item">' + (a.type && a.type.startsWith('image/') ? '<img src="' + esc(a.dataUrl) + '" alt="" />' : '<div style="padding:8px;font-size:10px;text-align:center;color:#999">' + esc(a.name) + '</div>') + '<button class="att-del" onclick="delAttached(' + i + ')">✕</button></div>').join('')
    }
    function delAttached(i) {
      attachedFiles.splice(i, 1);
      renderAttached()
    }

    /* ── Settings popover ── */
    function openSettings() {
      const p = editingId !== null ? projects.find(pr => pr.id === editingId) : null;
      settingsTemp = { desc: p && p.desc || '', longDesc: p && p.longDesc || '', role: p && p.role || '', tools: p && p.tools || '', cover: editingCover, blockSpacing: (p && p.blockSpacing) ?? 60 };
      document.getElementById('setDesc').value = settingsTemp.desc;
      document.getElementById('setLongDesc').value = settingsTemp.longDesc;
      document.getElementById('setRole').value = settingsTemp.role;
      document.getElementById('setTools').value = settingsTemp.tools;
      document.getElementById('setSpacing').value = settingsTemp.blockSpacing;
      document.getElementById('setSpacingVal').textContent = settingsTemp.blockSpacing + 'px';
      const cp = document.getElementById('setCoverPreview');
      const cu = resolveCoverLocal({ cover: settingsTemp.cover }) || '';
      cp.innerHTML = cu ? `<img src="${esc(cu)}" class="cover-preview" alt="" /><button onclick="removeSettingsCover()" style="padding:4px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#999;font-size:12px;margin-top:4px;cursor:pointer">Remover capa</button>` : '<div style="color:#bbb;font-size:13px;padding:12px 0">Nenhuma capa selecionada</div>';
      const si = document.getElementById('setCoverInput');
      si.onchange = ev => {
        const f = ev.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = async ev2 => {
          settingsTemp.cover = ev2.target.result;
          cp.innerHTML = `<img src="${esc(settingsTemp.cover)}" class="cover-preview" alt="" /><button onclick="removeSettingsCover()" style="padding:4px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#999;font-size:12px;margin-top:4px;cursor:pointer">Remover capa</button>`
        };
        r.readAsDataURL(f)
      };
      document.getElementById('settingsPop').classList.add('open')
    }
    function closeSettings() { document.getElementById('settingsPop').classList.remove('open'); document.getElementById('setCoverInput').value = '' }
    function removeSettingsCover() { settingsTemp.cover = ''; document.getElementById('setCoverPreview').innerHTML = '<div style="color:#bbb;font-size:13px;padding:12px 0">Nenhuma capa selecionada</div>' }
    function saveSettings() {
      settingsTemp.desc = document.getElementById('setDesc').value;
      settingsTemp.longDesc = document.getElementById('setLongDesc').value;
      settingsTemp.role = document.getElementById('setRole').value;
      settingsTemp.tools = document.getElementById('setTools').value;
      settingsTemp.blockSpacing = parseInt(document.getElementById('setSpacing').value) || 0;
      editingCover = settingsTemp.cover;
      closeSettings();
      showToast('Configurações salvas')
    }

    /* ── Save from editor ── */
    async function saveFromEditor() {
      try {
        const title = document.getElementById('edTitle') && document.getElementById('edTitle').value.trim() || '';
        if (!title) { showToast('O título é obrigatório'); return }
        const tag = document.getElementById('edTag') && document.getElementById('edTag').value.trim() || '';
        const ano = document.getElementById('edAno') && document.getElementById('edAno').value.trim() || '';
        const meta = settingsTemp || { desc: '', longDesc: '', role: '', tools: '', blockSpacing: 60 };
        const blocks = (editingBlocks || []).map(b => JSON.parse(JSON.stringify(b)));
        const projectData = {
          title, tag, desc: meta.desc, longDesc: meta.longDesc,
          role: meta.role, ano, tools: meta.tools,
          cover: editingCover || '',
          blockSpacing: meta.blockSpacing,
          blocks: blocks,
          media: []
        };
        if (editingId !== null) {
          const idx = projects.findIndex(p => p.id === editingId);
          if (idx !== -1) projects[idx] = { ...projects[idx], ...projectData };
        } else {
          const newId = projects.length > 0 ? Math.max(...projects.map(p => p.id)) + 1 : 0;
          projects.push({ id: newId, ...projectData });
        }
        showToast('Salvando projeto...');
        await saveProjects();
        closeEditor();
        renderAdmin();
        showToast('Projeto salvo!');
        console.log('[Editor] Projeto salvo com sucesso:', projectData.title);
      } catch(e) {
        console.error('[Editor] Erro ao salvar projeto:', e);
        showToast('Erro ao salvar: ' + e.message);
      }
    }

    function showDeleteConfirm(id) {
      const p = projects.find(pr => pr.id === id);
      if (!p) return;
      document.getElementById('confirmTitle').textContent = 'Excluir Projeto';
      document.getElementById('confirmMessage').textContent = `Tem certeza que deseja excluir "${p.title}"?`;
      document.getElementById('confirmId').value = id;
      document.getElementById('confirmYes').textContent = 'Excluir';
      document.getElementById('confirmYes').style.background = 'var(--danger)';
      document.getElementById('confirmModal').classList.add('open');
    }

    function closeConfirmModal() {
      document.getElementById('confirmModal').classList.remove('open');
    }

    function doDeleteProject(id) {
      try {
        projects = projects.filter(p => p.id !== id);
        projects.forEach((p, i) => p.id = i);
        saveProjects();
        renderAdmin();
        showToast('Projeto excluído!');
      } catch (err) {
        showToast('Erro ao excluir: ' + err.message);
      }
    }

    function rebuildAll() {
      loadProjects();
      buildSlides();
    }

    function reloadFromStorage() {
      loadProjects();
      buildSlides();
    }

    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) reloadFromStorage();
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        reloadFromStorage();
        closeOverlay();
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      /* Load local data immediately — don't block on Supabase */
      loadProjects();
      buildSlides();
      initDragScroll();
      /* Sync from Supabase in background; will overwrite localStorage + rebuild */
      syncAllFromSB().catch(function(e) {
        console.warn('[Supabase] Background sync failed:', e);
      });

      /* ── Click on carousel card → open project overlay ── */
      const container = document.getElementById('carouselContainer');
      container.addEventListener('click', (e) => {
        if (isMobileView()) {
          const card = e.target.closest('.carousel-card');
          if (card && card.dataset.isProject === 'true') {
            const id = parseInt(card.dataset.projectId);
            openProject(id);
          }
          return;
        }
        if (didDrag) return;
        if (!pointerDownCard) return; // already handled in pointerup
        const card = e.target.closest('.carousel-card');
        if (!card) return;
        if (card.dataset.isProject === 'true') {
          const id = parseInt(card.dataset.projectId);
          openProject(id);
        }
      });

      /* ── Mouse wheel / trackpad → slide carousel ── */
      container.addEventListener('wheel', (e) => {
        if (isMobileView()) return;
        if (document.getElementById('overlay').classList.contains('open') ||
            document.getElementById('adminPanel').classList.contains('open')) return;
        e.preventDefault();
        const delta = e.deltaX || e.deltaY;
        currentOffset -= delta * 0.8;
        render();
      }, { passive: false });

      /* ── Mobile: infinite vertical scroll ── */
      {
        let _adjusting = false;
        container.addEventListener('scroll', () => {
          if (!isMobileView() || _adjusting) return;
          const setH = getSetHeight();
          if (setH <= 0) return;
          const st = container.scrollTop;
          const maxSt = container.scrollHeight - container.clientHeight;
          _adjusting = true;
          if (st < setH * 0.3) {
            container.scrollTop = setH;
          } else if (st > maxSt - setH * 0.3) {
            container.scrollTop = setH;
          }
          _adjusting = false;
        }, { passive: true });
      }

      /* Hamburger toggle */
      const hamburger = document.getElementById('hamburgerBtn');
      const mobileMenu = document.getElementById('mobileMenu');
      if (hamburger && mobileMenu) {
        hamburger.addEventListener('click', function(e) {
          e.stopPropagation();
          this.classList.toggle('active');
          mobileMenu.classList.toggle('open');
        });
        mobileMenu.querySelectorAll('a').forEach(a => {
          a.addEventListener('click', function() {
            hamburger.classList.remove('active');
            mobileMenu.classList.remove('open');
          });
        });
        document.addEventListener('click', function(e) {
          if (!hamburger.contains(e.target) && !mobileMenu.contains(e.target)) {
            hamburger.classList.remove('active');
            mobileMenu.classList.remove('open');
          }
        });
      }

      document.getElementById('overlayClose').addEventListener('click', closeOverlay);
      document.getElementById('overlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeOverlay();
      });

      document.getElementById('loginBtn').addEventListener('click', attemptLogin);
      document.getElementById('loginPassword').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') attemptLogin();
      });

      document.getElementById('adminClose').addEventListener('click', closeAdmin);

      document.getElementById('confirmYes').addEventListener('click', (e) => {
        e.preventDefault();
        const val = document.getElementById('confirmId').value;
        if (val === 'import') {
          doImportProjects();
          closeConfirmModal();
          return;
        }
        const id = parseInt(val);
        if (!isNaN(id)) {
          doDeleteProject(id);
          closeConfirmModal();
        }
      });
      document.getElementById('confirmNo').addEventListener('click', (e) => {
        e.preventDefault();
        closeConfirmModal();
      });
      document.getElementById('confirmModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeConfirmModal();
      });

      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'a' || e.key === 'A')) {
          e.preventDefault();
          if (document.getElementById('adminPanel').classList.contains('open')) {
            closeAdmin();
          } else {
            openLogin();
          }
          return;
        }
        if (e.key === 'Escape') {
          if (document.getElementById('adminPanel').classList.contains('open')) {
            closeAdmin();
            return;
          }
          if (document.getElementById('loginOverlay').classList.contains('open')) {
            closeLogin();
            return;
          }
          closeOverlay();
        }
        if (document.getElementById('overlay').classList.contains('open') ||
            document.getElementById('adminPanel').classList.contains('open')) return;
        if (e.key === 'ArrowRight') {
          goToProject(getCurrentProjectIndex() + 1);
        }
        if (e.key === 'ArrowLeft') {
          goToProject(getCurrentProjectIndex() - 1);
        }
      });

      function setupNavLink(link) {
        if (!link || link.dataset._navBound) return;
        link.dataset._navBound = '1';
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const target = link.dataset.slide;
          /* Close mobile menu */
          const hb = document.getElementById('hamburgerBtn');
          const mm = document.getElementById('mobileMenu');
          if (hb) hb.classList.remove('active');
          if (mm) mm.classList.remove('open');
          if (target === 'sobre') { closeOverlay(); openSobre(); return; }
          if (target === 'contato') { closeOverlay(); openContato(); return; }
          closeOverlay();
          if (isMobileView()) {
            const c = document.getElementById('carouselContainer');
            if (c) c.scrollTo({ top: getSetHeight(), behavior: 'smooth' });
          } else {
            currentOffset = getStageXForIndex(projects.length);
            render();
          }
          document.querySelectorAll('.nav-links a, .mobile-menu a').forEach(a => a.classList.remove('active'));
          link.classList.add('active');
        });
      }
      document.querySelectorAll('.nav-links a[data-slide], .mobile-menu a[data-slide]').forEach(setupNavLink);

      /* ── Hash sync ── */
      let lastHashIdx = -1;
      function syncHash() {
        const idx = getCurrentProjectIndex();
        if (idx !== lastHashIdx) {
          lastHashIdx = idx;
          const h = `project-${idx}`;
          if (location.hash !== `#${h}`) history.replaceState(null, '', `#${h}`);
        }
      }
      const origRender = render;
      render = function() {
        origRender();
        syncHash();
        const idx = getCurrentProjectIndex();
        document.querySelectorAll('.nav-links a, .mobile-menu a').forEach(a => a.classList.remove('active'));
        const projectsLink = document.querySelector('.nav-links a[data-slide="0"], .mobile-menu a[data-slide="0"]');
        if (projectsLink) projectsLink.classList.add('active');
      };

      render();

      /* ── Restore from hash on load ── */
      const initHash = location.hash.replace('#', '');
      if (initHash.startsWith('project-')) {
        const n = parseInt(initHash.replace('project-', ''));
        if (!isNaN(n) && n >= 0 && n < projects.length) {
          currentOffset = getStageXForIndex(projects.length + n);
          render();
        }
      }




      document.addEventListener('change', (e) => {
        if (e.target.id === 'importInput') handleImport(e);
      });

    });

  </script>
</body>
</html>
